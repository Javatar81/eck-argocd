# One Application per (stack, env). valueFiles layer values-common.yaml under
# values-{{env}}.yaml. RollingSync promotes all stacks' dev, then all prod.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: elastic-stacks
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - stack: logs
            env: dev
            namespace: elastic-logs-dev
          - stack: logs
            env: prod
            namespace: elastic-logs-prod
          - stack: search
            env: dev
            namespace: elastic-search-dev
          - stack: search
            env: prod
            namespace: elastic-search-prod
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: env
              operator: In
              values: [dev]
        - matchExpressions:
            - key: env
              operator: In
              values: [prod]
  template:
    metadata:
      name: "{{stack}}-{{env}}"
      labels:
        env: "{{env}}"
        stack: "{{stack}}"
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      project: elastic-stacks
      sources:
        - repoURL: https://helm.elastic.co
          chart: eck-stack
          targetRevision: 0.20.0
          helm:
            releaseName: "{{stack}}"
            skipCrds: true
            valueFiles:
              - $values/stacks/{{stack}}/values-common.yaml
              - $values/stacks/{{stack}}/values-{{env}}.yaml
        - repoURL: https://github.com/Javatar81/eck-argocd.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
          - SkipDryRunOnMissingResource=true
