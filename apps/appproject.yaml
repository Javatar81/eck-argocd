# Wave -2. Stack project stays off CRDs and webhook config.
# Namespace is the one cluster resource, required by CreateNamespace=true.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: elastic-stacks
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: Elasticsearch and Kibana stacks. Promoted dev then prod.
  sourceRepos:
    - https://helm.elastic.co
    - https://github.com/Javatar81/eck-argocd.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: elastic-logs-dev
    - server: https://kubernetes.default.svc
      namespace: elastic-logs-prod
    - server: https://kubernetes.default.svc
      namespace: elastic-search-dev
    - server: https://kubernetes.default.svc
      namespace: elastic-search-prod
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
