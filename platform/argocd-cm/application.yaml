apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-cm-eck
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  source:
    repoURL: https://github.com/Javatar81/eck-argocd.git
    targetRevision: main
    path: platform/argocd-cm
    directory:
      include: argocd-cm.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
