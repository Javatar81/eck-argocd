# installCRDs is false because platform/eck-crds owns the CRDs.
installCRDs: false

# Both stages run on this cluster. The operator ignores any namespace not listed here.
managedNamespaces:
  - elastic-dev
  - elastic-prod

webhook:
  enabled: true

resources:
  requests:
    cpu: 100m
    memory: 150Mi
  limits:
    cpu: "1"
    memory: 1Gi
