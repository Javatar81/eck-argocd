# installCRDs is false because platform/eck-crds owns the CRDs.
installCRDs: false

# One namespace per (stack, env). The operator ignores any namespace not listed here.
managedNamespaces:
  - elastic-logs-dev
  - elastic-logs-prod
  - elastic-search-dev
  - elastic-search-prod


webhook:
  enabled: true

resources:
  requests:
    cpu: 100m
    memory: 150Mi
  limits:
    cpu: "1"
    memory: 1Gi
